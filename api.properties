# Адреса внешних API и User-Agent. В исходниках их нет: shared/build.gradle.kts
# генерирует из этого файла объект ApiConfig в shared/build/generated.
#
# Свои значения (зеркало MusicBrainz, тестовый сервер) — в local.properties
# с префиксом api., например api.musicbrainz.url=... Он в git не попадает.
# Ключей у этих API нет; если появятся — только в local.properties.

musicbrainz.url=https://musicbrainz.org/ws/2/
wikidata.url=https://www.wikidata.org/w/api.php
wikidata.sparql.url=https://query.wikidata.org/sparql
# {lang} — код языка Википедии, к адресу дописывается название статьи.
wikipedia.summary.url=https://{lang}.wikipedia.org/api/rest_v1/page/summary/
commons.thumb.url=https://upload.wikimedia.org/wikipedia/commons/thumb/

# MusicBrainz и Викиданные требуют User-Agent с контактом. В браузере его
# задать нельзя, там подставляется браузерный.
user.agent=rap-catalog/1.0 (https://github.com/andreykolokhmatov/rap-catalog)
